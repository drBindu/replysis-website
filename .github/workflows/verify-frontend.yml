name: Verify Frontend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.4.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Smoke test production container
        run: |
          docker build --pull --tag coopilotx-frontend:verify .
          docker run -d --rm --name coopilotx-frontend-verify -p 3000:3000 coopilotx-frontend:verify
          for attempt in $(seq 1 12); do
            if curl -fsS http://127.0.0.1:3000/api/healthz >/dev/null; then
              docker stop coopilotx-frontend-verify
              exit 0
            fi
            sleep 5
          done
          docker logs coopilotx-frontend-verify
          docker stop coopilotx-frontend-verify || true
          exit 1
